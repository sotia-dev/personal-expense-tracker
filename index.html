<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Personal Expense Tracker</h1>
            <p>Manage Your Personal Income & Expenses</p>
        </header>

        <!-- Summary Cards -->
        <section class="summary-cards">
            <div class="card balance">
                <h3>Total Balance</h3>
                <p id="total-balance">€0.00</p>
            </div>
            <div class="card income">
                <h3>Total Income</h3>
                <p id="total-income">+€0.00</p>
            </div>
            <div class="card expense">
                <h3>Total Expenses</h3>
                <p id="total-expense">-€0.00</p>
            </div>
        </section>

        <!-- Main Grid: Form & Chart -->
        <section class="main-grid">
            <div class="form-container">
                <h2>Add New Transaction</h2>
                <form id="transaction-form">
                    <div class="form-group">
                        <label for="type">Transaction Type</label>
                        <select id="type" required>
                            <option value="expense">Expense (-)</option>
                            <option value="income">Income (+)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="e.g. Supermarket, Salary" required>
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount (€)</label>
                        <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
                    </div>

                    <div class="form-group" id="category-group">
                        <label for="category">Category</label>
                        <select id="category">
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-submit">Add Transaction</button>
                </form>
            </div>

            <div class="chart-container">
                <h2>Expense Breakdown</h2>
                <div class="canvas-wrapper">
                    <canvas id="expense-chart"></canvas>
                </div>
            </div>
        </section>

        <!-- Transaction History -->
        <section class="history-section">
            <div class="history-header">
                <h2>Transaction History</h2>
                <button id="clear-all" class="btn-clear">Clear All</button>
            </div>
            <ul id="transaction-list" class="transaction-list"></ul>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
